[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Filter out warnings from library internals we cannot control:
# 1. Pydantic v1 compat: "class Config" style deprecated (not our schemas)
# 2. Pydantic v1 + Python 3.13: ForwardRef._evaluate() missing type_params
filterwarnings =
    ignore:Support for class-based `config` is deprecated:pydantic.PydanticDeprecatedSince20
    ignore:Failing to pass a value to the 'type_params' parameter of 'typing.ForwardRef._evaluate':DeprecationWarning