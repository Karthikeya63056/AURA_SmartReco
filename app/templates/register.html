{% extends "base.html" %}

{% block title %}Register — SmartReco 2026{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="glass-panel rounded-2xl p-8 space-y-6 border border-slate-800">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold tracking-tight text-slate-100">Create Your Account</h1>
            <p class="text-xs text-slate-400">Join SmartReco to get AI agent-driven course suggestions.</p>
        </div>

        <form id="register-form" class="space-y-4" onsubmit="handleRegister(event)">
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Full Name</label>
                <input type="text" id="full_name" required placeholder="John Doe" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 text-slate-100">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Email Address</label>
                <input type="email" id="email" required placeholder="user@example.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 text-slate-100">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 text-slate-100">
            </div>
            <div id="error-msg" class="text-xs text-red-400 hidden"></div>
            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold py-2.5 rounded-xl shadow-lg transition-all">
                Create Account
            </button>
        </form>

        <div class="text-center text-xs text-slate-400">
            <span>Already registered? <a href="/login" class="text-cyan-400 hover:underline">Sign In</a></span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function handleRegister(e) {
        e.preventDefault();
        const errDiv = document.getElementById('error-msg');
        errDiv.classList.add('hidden');

        const body = {
            full_name: document.getElementById('full_name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            const res = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const data = await res.json();
                throw new Error(data.detail || 'Registration failed');
            }
            window.location.href = '/login';
        } catch (err) {
            errDiv.innerText = err.message;
            errDiv.classList.remove('hidden');
        }
    }
</script>
{% endblock %}
