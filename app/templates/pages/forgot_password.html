{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-page fade-in">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="subtitle">Enter your email and we'll send you a link to choose a new password</p>

    <form id="forgotForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">
        Send reset link
      </button>
    </form>

    <div class="auth-footer">
      Remembered it? <a href="/login">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('forgotForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = e.target.querySelector('button[type="submit"]');
  var originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Sending...';

  fetch('/auth/forgot-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ email: document.getElementById('email').value })
  })
    .then(function () {
      btn.textContent = '✓ Check your inbox';
      if (window.AURA_UI) {
        AURA_UI.toast('If that email is in our system, a reset link is on its way.', 'success');
      }
    })
    .catch(function () {
      btn.textContent = originalText;
      btn.disabled = false;
      if (window.AURA_UI) AURA_UI.toast('Something went wrong. Try again.', 'error');
    });
});
</script>
{% endblock %}
