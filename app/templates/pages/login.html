{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div class="auth-page fade-in">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue your learning journey</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="username" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">
        Sign in
      </button>
    </form>

    <p style="text-align:center; margin-top:20px;">
      <a href="/auth/forgot-page" class="text-cyan text-sm">Forgot your password?</a>
    </p>

    <div class="auth-footer">
      Don't have an account? <a href="/register">Create one</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/pages/auth.js"></script>
{% endblock %}
