{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-page fade-in">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="subtitle">Start your personalized learning journey</p>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">
        Create account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/pages/auth.js"></script>
{% endblock %}
