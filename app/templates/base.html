<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AURA — Adaptive User Recommendation Agent. Personalized course recommendations powered by LangGraph and Mesh API.">
  <title>{% block title %}AURA{% endblock %} — Adaptive User Recommendation Agent</title>

  <!-- Design system -->
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages.css">

  {% block head %}{% endblock %}
</head>
<body>
  {% include "components/nav.html" %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include "components/footer.html" %}
  {% include "components/toast.html" %}

  <!-- 1. Load Markdown & Sanitizer FIRST (Synchronously, before core JS) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

  <!-- 2. Core JS (order matters) -->
  <script src="/static/js/core/api.js"></script>
  <script src="/static/js/core/auth.js"></script>
  <script src="/static/js/core/ui.js"></script>
  <script src="/static/js/tracking/tracker.js"></script>

  <script>
    (function () {
      // Floating nav on scroll
      var nav = document.getElementById('navWrapper');
      if (nav) {
        window.addEventListener('scroll', function () {
          nav.classList.toggle('scrolled', window.scrollY > 20);
        }, { passive: true });
      }

      // Mobile nav toggle (simple: show/hide .nav-links)
      var toggle = document.getElementById('navToggle');
      var links = document.querySelector('.nav-links');
      if (toggle && links) {
        toggle.addEventListener('click', function () {
          var open = links.classList.toggle('nav-links-open');
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          // Inline fallback if CSS for .nav-links-open not added yet
          if (open) {
            links.style.display = 'flex';
            links.style.flexDirection = 'column';
            links.style.position = 'absolute';
            links.style.top = '100%';
            links.style.right = '16px';
            links.style.left = '16px';
            links.style.background = 'var(--bg-glass-strong)';
            links.style.backdropFilter = 'blur(20px)';
            links.style.border = '1px solid var(--border)';
            links.style.borderRadius = 'var(--radius)';
            links.style.padding = '16px';
            links.style.gap = '12px';
            links.style.zIndex = '110';
          } else {
            links.style.display = '';
            links.style.flexDirection = '';
            links.style.position = '';
            links.style.top = '';
            links.style.right = '';
            links.style.left = '';
            links.style.background = '';
            links.style.backdropFilter = '';
            links.style.border = '';
            links.style.borderRadius = '';
            links.style.padding = '';
            links.style.gap = '';
            links.style.zIndex = '';
          }
        });
      }
    })();
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
