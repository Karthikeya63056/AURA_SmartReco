{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue your learning journey</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <!-- name="username" is required by OAuth2PasswordRequestForm -->
        <input type="email" id="email" name="username" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">
        Sign in
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="/register">Create one</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const formData = new FormData(this);
  try {
    // Router prefix is /auth (not /api/auth)
    const res = await fetch('/auth/login', {
      method: 'POST',
      body: formData
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(err.detail || 'Login failed');
      return;
    }
    const data = await res.json();
    localStorage.setItem('access_token', data.access_token);
    window.location.href = '/dashboard';
  } catch (err) {
    alert('Something went wrong. Please try again.');
  }
});
</script>
{% endblock %}
