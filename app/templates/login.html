{% extends "base.html" %}

{% block title %}Sign In — SmartReco 2026{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="glass-panel rounded-2xl p-8 space-y-6 border border-slate-800">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold tracking-tight text-slate-100">Welcome Back</h1>
            <p class="text-xs text-slate-400">Sign in to sync your behavior profile across devices.</p>
        </div>

        <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Email Address</label>
                <input type="email" id="email" required value="demo@smartreco.ai" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 text-slate-100">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Password</label>
                <input type="password" id="password" required value="demo123456" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 text-slate-100">
            </div>
            <div id="error-msg" class="text-xs text-red-400 hidden"></div>
            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold py-2.5 rounded-xl shadow-lg transition-all">
                Sign In
            </button>
        </form>

        <div class="text-center text-xs text-slate-500">
            <span>Demo Account: <code>demo@smartreco.ai</code> / <code>demo123456</code></span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function handleLogin(e) {
        e.preventDefault();
        const errDiv = document.getElementById('error-msg');
        errDiv.classList.add('hidden');

        const formData = new FormData();
        formData.append('username', document.getElementById('email').value);
        formData.append('password', document.getElementById('password').value);

        try {
            const res = await fetch('/auth/login', {
                method: 'POST',
                body: formData
            });
            if (!res.ok) {
                const data = await res.json();
                throw new Error(data.detail || 'Login failed');
            }
            const data = await res.json();
            localStorage.setItem('access_token', data.access_token);
            window.location.href = '/';
        } catch (err) {
            errDiv.innerText = err.message;
            errDiv.classList.remove('hidden');
        }
    }
</script>
{% endblock %}
