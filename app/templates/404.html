{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}

<section class="section fade-in" style="padding-top: 160px; padding-bottom: 120px; text-align: center;">
  
  <div class="hero-badge" style="margin-bottom: 24px;">
    404
  </div>

  <h1 class="section-title" style="font-size: clamp(2.4rem, 5vw, 3.4rem); margin-bottom: 16px;">
    Page not found
  </h1>

  <p class="text-muted" style="max-width: 440px; margin: 0 auto 36px; font-size: 1.05rem; line-height: 1.7;">
    The page you’re looking for doesn’t exist or may have been moved.
    Let’s get you back on track.
  </p>

  <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
    <a href="/" class="btn btn-cyan btn-lg">Go Home</a>
    <a href="/catalog" class="btn btn-outline btn-lg">Browse Courses</a>
  </div>

</section>

{% endblock %}
